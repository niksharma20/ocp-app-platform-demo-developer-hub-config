# Developer Hub 2.1: the assistant's lightspeed-core sidecar reads the LLM
# endpoint from this Secret (see the vllm provider in
# configmap-intelligent-assistant-stack.yaml). Replaces llama-stack-secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: intelligent-assistant-secrets
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: intelligent-assistant-secrets
    creationPolicy: Owner
    template:
      data:
        VLLM_URL: "{{ "{{ .base_url }}" }}"
        VLLM_API_KEY: "{{ "{{ .api_key }}" }}"
  data:
    - secretKey: base_url
      remoteRef:
        key: secrets/litellm/credentials
        property: base_url
    - secretKey: api_key
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
