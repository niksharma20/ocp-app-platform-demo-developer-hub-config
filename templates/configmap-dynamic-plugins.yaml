kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # Developer Hub 2.1 (Backstage 1.54.9, new frontend system):
  # - plugins are no longer inside the image: ./dynamic-plugins/dist/... paths
  #   are skipped. Supported plugins are enabled with ref://<image name> from
  #   the catalog index (dynamic-plugins.default.yaml); community plugins use
  #   the 2.1 builds (rhdh-plugin-export-overlays, catalog-index-release-2.1).
  # - frontend plugins place themselves (new frontend system), so the legacy
  #   mountPoints/entityTabs wiring is gone. App launcher links: app-config
  #   globalHeader.menuItems.
  # - no 2.1 builds of the GitLab card (immobiliarelabs), the Jira card
  #   (roadiehq) or the icon viewer: removed.
  # - Lightspeed is now the Intelligent Assistant, enabled by the operator's
  #   intelligent-assistant flavour (see backstage-cr.yaml).
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Disable the quickstart plugin to avoid distracting people on initial sign-in
      - package: ref://red-hat-developer-hub-backstage-plugin-quickstart
        enabled: false

      # Sign-in with Keycloak (app-config auth.providers.oidc, signInPage: oidc).
      # Built into the backend up to 1.9; a plugin, off by default, in 2.1.
      - package: ref://backstage-plugin-auth-backend-module-oidc-provider
        enabled: true

      # Bulk import plugins
      - package: ref://red-hat-developer-hub-backstage-plugin-bulk-import-backend
        enabled: true
      - package: ref://red-hat-developer-hub-backstage-plugin-bulk-import
        enabled: true

      # MCP Server plugins (2.1: the MCP tool plugins are the *-mcp-extras plugins)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.9__0.2.1!backstage-plugin-mcp-actions-backend'
        enabled: true
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.9__0.2.5'
        enabled: true
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.9__0.2.6'
        enabled: true

      # Kubernetes
      - package: ref://backstage-plugin-kubernetes-backend
        enabled: true
      - package: ref://backstage-plugin-kubernetes
        enabled: true
      - package: ref://backstage-community-plugin-topology
        enabled: true

      # Tekton (community 4.0.5 for Backstage 1.54.9)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton@sha256:5aa66213e061e2d86e8a7566e0ac9d957fa6fa983121b8cff370b529fc017027'
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                translationResources:
                  - importName: tektonTranslations
                    ref: tektonTranslationRef

      # Keycloak (users and groups from the backstage realm)
      - package: ref://backstage-community-plugin-catalog-backend-module-keycloak
        enabled: true

      # Argo CD (community 3.1.3 frontend + its 1.7.2 backend, as paired in the
      # 2.1 catalog; the Roadie backend would register the same plugin id)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd@sha256:040c49c1fdfcec81c1df7d62d033c05431bca4790c9ef7b4f193a19a79bcf980'
        enabled: true
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend@sha256:f3a3ac22d5a615dac3fb99a7f64e41d2e64e0909221774adbaebbc0dc6e68ed3'
        enabled: true
      # Scaffolder actions argocd:* (used by the orchestrator namespace template)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd@sha256:d0c5689e4fc7b3bd74adf98dfad311dc81c73d8457b6113abf3a3926386e57eb'
        enabled: true

      # GitLab (catalog discovery and scaffolder actions)
      - package: ref://backstage-plugin-scaffolder-backend-module-gitlab
        enabled: true
      - package: ref://backstage-plugin-catalog-backend-module-gitlab
        enabled: true

      # RBAC page (Administration > RBAC; menu entry comes with the 2.1 default config)
      - package: ref://backstage-community-plugin-rbac
        enabled: true

      # Global header: on by default in 2.1; launcher links are in app-config
      - package: ref://red-hat-developer-hub-backstage-plugin-global-header
        enabled: true

      # Orchestrator plugins
      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator:{{ "{{" }}inherit{{ "}}" }}'
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              red-hat-developer-hub.backstage-plugin-orchestrator:
                appIcons:
                - importName: OrchestratorIcon
                  name: orchestratorIcon
                dynamicRoutes:
                - importName: OrchestratorPage
                  menuItem:
                    icon: orchestratorIcon
                    text: Orchestrator
                    textKey: menuItem.orchestrator
                  path: /orchestrator
                entityTabs:
                - path: /workflows
                  title: Workflows
                  titleKey: catalog.entityPage.workflows.title
                  mountPoint: entity.page.workflows
                mountPoints:
                - mountPoint: entity.page.workflows/cards
                  importName: OrchestratorCatalogTab
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      anyOf:
                      - IsOrchestratorCatalogTabAvailable
      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-backend:{{ "{{" }}inherit{{ "}}" }}'
        enabled: true
        dependencies:
          - ref: sonataflow
      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator:{{ "{{" }}inherit{{ "}}" }}'
        enabled: true
      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets:{{ "{{" }}inherit{{ "}}" }}'
        enabled: true

      # Notification plugins (required by orchestrator workflows)
      - package: ref://backstage-plugin-notifications
        enabled: true
      - package: ref://backstage-plugin-signals
        enabled: true
      - package: ref://backstage-plugin-notifications-backend
        enabled: true
      - package: ref://backstage-plugin-signals-backend
        enabled: true

      # SonarQube (community 1.3.0)
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube@sha256:56624054253a582d821fcc36d8ea1d51d865d3922c572326fe8c37af301cc43d'
        enabled: true
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-sonarqube-backend@sha256:5c0386e137701db1b328304a5336d5b443799dbc2c3a3de5e275d980c7c5a505'
        enabled: true

      # Scorecards (technology preview in 2.1) with the Jira data source
      - package: ref://red-hat-developer-hub-backstage-plugin-scorecard
        enabled: true
      - package: ref://red-hat-developer-hub-backstage-plugin-scorecard-backend
        enabled: true
      - package: ref://red-hat-developer-hub-backstage-plugin-scorecard-backend-module-jira
        enabled: true

      # Quay (community 1.38.3); quay.uiUrl and the /quay/api proxy are in app-config
      - package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay@sha256:a682c05c0d532219f275f71fa8dc75339d518a58a24f7887d5724c2ac7286f1a'
        enabled: true
