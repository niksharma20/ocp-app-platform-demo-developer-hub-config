# Developer Hub 2.1 puts a default-deny NetworkPolicy on its pod and allows
# egress only to DNS, 443/6443, Redis, its Postgres and (orchestrator flavour)
# SonataFlow. The app-config proxy /jira/api goes to the in-cluster Jira stub
# (http://jira-stub.rhdh.svc.cluster.local:8080) for the scorecard's Jira data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: developer-hub-allow-jira-stub-egress
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
spec:
  podSelector:
    matchLabels:
      rhdh.redhat.com/app: backstage-developer-hub
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              name: jira-stub
      ports:
        - protocol: TCP
          port: 8080
