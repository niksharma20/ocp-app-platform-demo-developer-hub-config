apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Developer Hub 2.1: the operator ships the AI assistant itself
  # (flavour "intelligent-assistant", lightspeed-core sidecar). This config
  # used to add its own llama-stack and lightspeed-core containers; with 2.1
  # they collide with the operator's container of the same name.
  flavours:
    - name: intelligent-assistant
      enabled: true
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    dynamicPluginsConfigMapName: dynamic-plugins
    extraEnvs:
      # Seems to be needed for the kubernetes api interaction
      # since RHPDS cluster is using self-signed certificates
      # for the api server
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: gitlab-token
        - name: argocd-password
        - name: kubernetes-sa-token
        - name: oauth-client
        - name: backend-secret
        - name: backstage-orchestrator-token
        - name: sonarqube-secret
        # LLM endpoint for the assistant (VLLM_URL, VLLM_API_KEY), from Vault
        - name: intelligent-assistant-secrets
          containers:
            - lightspeed-core
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        # rbac-policy.csv and rbac-conditional-policies.yaml for permission.rbac
        - name: rbac-policy
        # Replaces the operator's bundled lightspeed-stack.yaml so the
        # assistant uses the platform's LiteLLM endpoint
        - name: intelligent-assistant-stack
          key: lightspeed-stack.yaml
          mountPath: /app-root
          containers:
            - lightspeed-core
    route:
      enabled: true
  deployment:
    patch:
      spec:
        replicas: 1
        template:
          spec:
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: dynamic-plugins-root
  database:
    enableLocalDb: true
